<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Pulse — статус</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="wrap top-row">
      <span class="logo" aria-hidden="true"></span>
      <h1>Pulse</h1>
      <span class="top-note">статус сервисов</span>
    </div>
  </header>

  <main class="wrap">
    <section id="overall" class="overall overall-loading" aria-live="polite">
      <span class="overall-dot" aria-hidden="true"></span>
      <div>
        <p class="overall-title" id="overall-title">Загружаем статус…</p>
        <p class="overall-meta" id="overall-meta"></p>
      </div>
    </section>

    <p id="error" class="error" role="alert" hidden></p>

    <section aria-labelledby="monitors-h">
      <h2 id="monitors-h">Мониторы</h2>
      <p class="hint">Нажмите на монитор, чтобы увидеть uptime по часам за 7 дней.</p>
      <ul id="monitors" class="monitors"></ul>
      <p id="monitors-empty" class="empty" hidden>Мониторов пока нет. Создайте их через <code>POST /api/v1/monitors</code> или <code>php bin/console seed</code>.</p>
    </section>

    <section aria-labelledby="incidents-h">
      <h2 id="incidents-h">Открытые инциденты</h2>
      <ul id="incidents" class="incidents"></ul>
      <p id="incidents-empty" class="empty" hidden>Открытых инцидентов нет.</p>
    </section>
  </main>

  <footer class="wrap foot">
    <span id="updated">—</span>
    <span>обновление каждые 15 с</span>
  </footer>

  <template id="monitor-tpl">
    <li class="monitor">
      <button type="button" class="monitor-row" aria-expanded="false">
        <span class="dot" aria-hidden="true"></span>
        <span class="m-name"></span>
        <span class="m-status"></span>
        <span class="m-uptime" title="Доля успешных проверок за 24 часа"></span>
        <span class="m-last"></span>
        <span class="chev" aria-hidden="true"></span>
      </button>
      <div class="detail" hidden></div>
    </li>
  </template>

  <script src="app.js" defer></script>
</body>
</html>
